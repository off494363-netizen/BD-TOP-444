<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - VIP Free Fire</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #060910;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .admin-card {
            background: #151b2b;
            border: 2px solid #ff00ff;
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
        }

        h2 {
            color: #ff00ff;
            text-align: center;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #a0aec0;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: #0b0f19;
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #3182ce;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .issue-box {
            background: #0b0f19;
            border: 1px solid #2d3748;
            border-radius: 8px;
            padding: 12px;
            margin-top: 15px;
            max-height: 250px;
            overflow-y: auto;
            font-size: 13px;
            color: #ff6b6b;
        }

        .clear-btn {
            background: #e53e3e;
            margin-top: 10px;
            padding: 8px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>🔐 রাইন বস অ্যাডমিন প্যানেল</h2>
        
        <!-- Login Form -->
        <div id="login-section">
            <div class="input-group">
                <label>অ্যাডমিন পাসওয়ার্ড দিন</label>
                <input type="password" id="admin-pass" placeholder="রাইন 444">
            </div>
            <button class="btn" onclick="checkAdminPassword()">লগইন করুন</button>
        </div>

        <!-- Dashboard Section (Hidden until correct password) -->
        <div id="panel-section" style="display: none;">
            <p style="color: #00ffff; font-size: 14px; margin-bottom: 10px;">ইউজারদের এআই সমস্যা ইনবক্স:</p>
            <div class="issue-box" id="issue-list">
                কোনো সমস্যা নেই।
            </div>
            <button class="btn clear-btn" onclick="clearIssues()">সব সমস্যা ক্লিয়ার করুন</button>
        </div>
    </div>

    <script>
        function checkAdminPassword() {
            const pass = document.getElementById('admin-pass').value;
            if(pass === 'R444') {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('panel-section').style.display = 'block';
                loadIssues();
                alert('স্বাগতম রাইন বস! অ্যাডমিন প্যানেল আনলক হয়েছে।');
            } else {
                alert('ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিন: রাইন 444');
            }
        }

        function loadIssues() {
            let issues = JSON.parse(localStorage.getItem('admin_issues') || '[]');
            const issueListDiv = document.getElementById('issue-list');
            if(issues.length > 0) {
                issueListDiv.innerHTML = issues.map((item, index) => 
                    `<div style="margin-bottom: 8px; border-bottom: 1px dashed #2d3748; padding-bottom: 5px;">
                        <b>#${index+1}</b> [${item.time}]: ${item.text}
                    </div>`
                ).join('');
            } else {
                issueListDiv.innerHTML = 'কোনো নতুন সমস্যা নেই।';
            }
        }

        function clearIssues() {
            localStorage.removeItem('admin_issues');
            loadIssues();
            alert('সব সমস্যা মুছে ফেলা হয়েছে!');
        }
    </script>
</body>
</html>
